backend:
    name: github
    repo: Omar-Afifi-Salama/dijkstra
    branch: main
    auth_type: pkce
    app_id: "Iv1. Ov23liq3Cg46TEVSFh2g"

# Set to true only when running `npx decap-server` locally
local_backend: false

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# ========================================================
# COLLECTIONS
# ========================================================
collections:
    # ------------------------------------------------------
    # 🇬🇧 ENGLISH (EN)
    # ------------------------------------------------------
    - name: "en_python_lessons"
      label: "🇬🇧 [EN] Python › Lessons"
      folder: "src/content/en/python/lessons"
      create: true
      extension: "mdx"
      format: "frontmatter"
      slug: "{{fields.order}}-{{fields.slug}}"
      fields:
          - {
                label: "Title",
                name: "title",
                widget: "string",
                pattern: ["^.{1,80}$", "Must be 1-80 characters"],
            }
          - {
                label: "Slug (URL identifier)",
                name: "slug",
                widget: "string",
                pattern:
                    [
                        "^[a-z0-9-]+$",
                        "Must be lowercase alphanumeric and dashes only (e.g. variables-and-types)",
                    ],
            }
          - {
                label: "Description",
                name: "description",
                widget: "string",
                pattern: ["^.{1,160}$", "Must be 1-160 characters"],
            }
          - {
                label: "Order",
                name: "order",
                widget: "number",
                value_type: "int",
                min: 1,
            }
          - {
                label: "Estimated Minutes",
                name: "estimatedMinutes",
                widget: "number",
                value_type: "int",
                min: 1,
                required: false,
            }
          - {
                label: "Authors",
                name: "authors",
                widget: "list",
                required: false,
                default: [],
            }
          - {
                label: "Contributors",
                name: "contributors",
                widget: "list",
                required: false,
                default: [],
            }
          - {
                label: "Translated By",
                name: "translatedBy",
                widget: "list",
                required: false,
                default: [],
            }
          - {
                label: "Tags",
                name: "tags",
                widget: "list",
                required: false,
                default: [],
            }
          - {
                label: "Updated At",
                name: "updatedAt",
                widget: "datetime",
                format: "YYYY-MM-DDTHH:mm:ssZ",
                date_format: "YYYY-MM-DD",
                time_format: "HH:mm",
            }
          - {
                label: "Canonical URL",
                name: "canonicalUrl",
                widget: "string",
                required: false,
            }
          - { label: "Body", name: "body", widget: "markdown" }

